name: Collect buses every 10 minutes

on:
  schedule:
    # Every ten minutes, offset from the busiest minute at the top of the hour.
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-bus-collection
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ !github.event.repository.fork && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect and persist live buses
        env:
          TRACKER_URL: ${{ vars.TRACKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/poll_scheduled.js
