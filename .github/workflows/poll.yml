name: Poll uNivUS API

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: bus-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll uNivUS and store observations
        run: npm run poll -- --once
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BUS_PROVIDER: ${{ vars.BUS_PROVIDER || 'auto' }}
          FMS_ROUTES: ${{ vars.FMS_ROUTES || 'A1,A2,D1,D2,E,K,R1,R2' }}
          BUS_STOPS: ${{ vars.BUS_STOPS || 'UTOWN,KR-MRT' }}
